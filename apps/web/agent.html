<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PowderTwin | AI Agent</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#061019;overflow:hidden}
iframe{border:0;width:100%;height:100%;display:block;background:#061019}
.fallback{position:fixed;inset:auto 16px 16px 16px;color:#dce9ef;font:14px/1.4 system-ui,sans-serif;text-align:center}
.fallback a{color:#5ed7d1}
</style>
</head>
<body>
<iframe id="twinFrame" src="/apps/web/v2.html" title="PowderTwin MVP"></iframe>
<div class="fallback"><a href="/apps/web/v2.html">Открыть без AI-моста</a></div>
<script>
const frame=document.getElementById('twinFrame');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    if(!doc||doc.getElementById('powderTwinAiBridgeScript'))return;
    const script=doc.createElement('script');
    script.id='powderTwinAiBridgeScript';
    script.src='/apps/web/ai-bridge.js';
    doc.body.appendChild(script);
  }catch(error){
    console.warn('AI bridge injection failed',error);
  }
});
</script>
</body>
</html>
